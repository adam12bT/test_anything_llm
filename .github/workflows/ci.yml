name: CI

# Runs on every push and PR, to any branch. This is the "does the code still
# work" gate. The separate deploy.yml workflow depends on this one passing
# before it will push to the Hugging Face Space.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Node version from .nvmrc
        id: nvmrc
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvmrc.outputs.version }}

      - name: Install server deps
        working-directory: server
        run: npm install --legacy-peer-deps

      - name: Install collector deps
        working-directory: collector
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm install --legacy-peer-deps

      - name: Lint (server + collector)
        run: |
          npm run lint:ci --prefix server
          npm run lint:ci --prefix collector

      - name: Unit tests
        run: npx jest --ci

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint the Hugging Face Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile.huggingface
          config: .hadolint.yaml

  docker-build-smoke-test:
    runs-on: ubuntu-latest
    needs: [lint-and-test, hadolint]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the HF image (no push — just prove it builds)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.huggingface
          push: false
          tags: anything-llm-lightweight:ci-check
          cache-from: type=gha
          cache-to: type=gha,mode=max
